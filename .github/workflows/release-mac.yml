name: Release Mac

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.6.0 or 0.6.0-beta"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-validation:
    name: Validate release source
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.version) || github.ref }}

      - name: Verify release contracts
        shell: bash
        run: |
          bash script/verify_native_release_contract.sh
          bash script/verify_full_build_contract.sh
          bash script/test_cleanup_build_artifacts.sh
          swift script/test_build_and_run_native_contract.swift
          swift script/test_native_settings_navigation_contract.swift

      - name: Verify Reader window and statistics persistence
        shell: bash
        run: |
          swift script/test_reader_window_contract.swift
          xcrun swiftc -parse-as-library \
            NativeMac/ReaderWindowGeometry.swift \
            script/test_reader_window_geometry.swift \
            -o "$RUNNER_TEMP/test_reader_window_geometry"
          "$RUNNER_TEMP/test_reader_window_geometry"
          xcrun swiftc -parse-as-library \
            Features/Reader/ReaderStatisticsPersistencePolicy.swift \
            script/test_reader_statistics_persistence.swift \
            -o "$RUNNER_TEMP/test_reader_statistics_persistence"
          "$RUNNER_TEMP/test_reader_statistics_persistence"

      - name: Verify Profile migration and Reader gallery indexing
        shell: bash
        run: |
          export CLANG_MODULE_CACHE_PATH="$RUNNER_TEMP/hoshi-clang-module-cache"
          export SWIFT_MODULECACHE_PATH="$RUNNER_TEMP/hoshi-swift-module-cache"

          xcrun swiftc -parse-as-library \
            Models/Anki.swift \
            Models/Book.swift \
            Models/Profile.swift \
            Models/Dictionary.swift \
            Core/ProfileRepository.swift \
            Core/ProfileDictionaryBackup.swift \
            script/test_profile_repository.swift \
            -o "$RUNNER_TEMP/test_profile_repository"
          "$RUNNER_TEMP/test_profile_repository"

          xcrun swiftc -parse-as-library \
            Util/ReaderCharacterNormalizer.swift \
            Models/Book.swift \
            Features/Reader/Gallery/ReaderImageGalleryIndex.swift \
            script/test_reader_gallery_index.swift \
            -o "$RUNNER_TEMP/test_reader_gallery_index"
          "$RUNNER_TEMP/test_reader_gallery_index"

          xcrun swift script/test_reader_gallery_contract.swift

      - name: Verify Manga and shared Reader regressions
        shell: bash
        run: |
          export CLANG_MODULE_CACHE_PATH="$RUNNER_TEMP/hoshi-clang-module-cache"
          export SWIFT_MODULECACHE_PATH="$RUNNER_TEMP/hoshi-swift-module-cache"

          swift test --package-path Libraries/AidokuRuntime
          swift script/test_manga_library_contract.swift
          swift script/test_bookshelf_layout_contract.swift
          swift script/test_reader_chapter_index_contract.swift
          swift script/test_popup_duplicate_button_rendering.swift

          xcrun swiftc -parse-as-library \
            Models/Manga.swift \
            script/test_manga_models.swift \
            -o "$RUNNER_TEMP/test_manga_models"
          "$RUNNER_TEMP/test_manga_models"

          xcrun swiftc -parse-as-library \
            Models/Suwayomi.swift \
            Features/Manga/SuwayomiClient.swift \
            script/test_suwayomi_connector.swift \
            -o "$RUNNER_TEMP/test_suwayomi_connector"
          "$RUNNER_TEMP/test_suwayomi_connector"

          xcrun swiftc -parse-as-library \
            Models/Manga.swift \
            Features/Manga/MangaPageProcessing.swift \
            script/test_manga_page_processing.swift \
            -o "$RUNNER_TEMP/test_manga_page_processing"
          "$RUNNER_TEMP/test_manga_page_processing"

          xcrun swiftc -parse-as-library \
            Models/Manga.swift \
            Features/Manga/MangaEPUBParser.swift \
            script/test_manga_epub_parser.swift \
            -o "$RUNNER_TEMP/test_manga_epub_parser"
          "$RUNNER_TEMP/test_manga_epub_parser"

          xcrun swiftc -parse-as-library \
            Models/Manga.swift \
            Features/Manga/MangaMokuroParser.swift \
            script/test_manga_mokuro_parser.swift \
            -o "$RUNNER_TEMP/test_manga_mokuro_parser"
          "$RUNNER_TEMP/test_manga_mokuro_parser"

          xcrun swiftc -parse-as-library \
            Models/Manga.swift \
            Features/Manga/MangaOCRService.swift \
            script/test_manga_google_lens_protocol.swift \
            -o "$RUNNER_TEMP/test_manga_google_lens_protocol"
          "$RUNNER_TEMP/test_manga_google_lens_protocol"

          xcrun swiftc -parse-as-library \
            Models/Manga.swift \
            Features/Manga/MangaOCRService.swift \
            script/test_manga_ocr_cache.swift \
            -o "$RUNNER_TEMP/test_manga_ocr_cache"
          "$RUNNER_TEMP/test_manga_ocr_cache"

          xcrun swiftc -parse-as-library \
            Util/ReaderCharacterNormalizer.swift \
            Models/Book.swift \
            Features/Reader/Gallery/ReaderImageGalleryIndex.swift \
            Features/Reader/ReaderChapterIndex.swift \
            script/test_reader_chapter_index.swift \
            -o "$RUNNER_TEMP/test_reader_chapter_index"
          "$RUNNER_TEMP/test_reader_chapter_index"

          xcrun swiftc -parse-as-library \
            Features/Reader/ReaderWebView/ReaderViewportGeometry.swift \
            script/test_reader_popup_sasayaki_regressions.swift \
            -o "$RUNNER_TEMP/test_reader_popup_sasayaki_regressions"
          "$RUNNER_TEMP/test_reader_popup_sasayaki_regressions"

          xcrun swiftc -parse-as-library \
            Models/Anki.swift \
            script/test_upstream_sync_picks.swift \
            -o "$RUNNER_TEMP/test_upstream_sync_picks"
          "$RUNNER_TEMP/test_upstream_sync_picks"

      - name: Verify Video Anime4K contract
        shell: bash
        run: swift script/test_video_anime4k_contract.swift

      - name: Verify high-risk Video subtitle and remote regressions
        shell: bash
        run: |
          export CLANG_MODULE_CACHE_PATH="$RUNNER_TEMP/hoshi-clang-module-cache"
          export SWIFT_MODULECACHE_PATH="$RUNNER_TEMP/hoshi-swift-module-cache"

          ./script/test_video_online_subtitles.sh
          swift script/test_video_ajatt_contract.swift
          xcrun swiftc -parse-as-library \
            Models/Subtitle.swift \
            Features/Video/Remote/YouTubeURLParser.swift \
            Features/Video/Remote/RemoteVideoSource.swift \
            Features/Video/Remote/BoundedURLSessionData.swift \
            Features/Video/Subtitles/AJATTSubtitleCatalogClient.swift \
            script/test_video_ajatt_client.swift \
            -o "$RUNNER_TEMP/test_video_ajatt_client"
          "$RUNNER_TEMP/test_video_ajatt_client"

          xcrun swiftc -parse-as-library \
            Models/Subtitle.swift \
            Features/Video/Remote/YouTubeURLParser.swift \
            Features/Video/Remote/RemoteVideoSource.swift \
            Features/Video/Remote/BoundedURLSessionData.swift \
            Features/Video/Remote/RemoteSubtitleLoader.swift \
            script/test_video_remote_subtitle_loader.swift \
            -o "$RUNNER_TEMP/test_video_remote_subtitle_loader"
          "$RUNNER_TEMP/test_video_remote_subtitle_loader"

          xcrun swiftc -parse-as-library \
            Features/Video/Subtitles/EmbeddedSubtitlePayloadParser.swift \
            script/test_video_embedded_subtitle_payload.swift \
            -o "$RUNNER_TEMP/test_video_embedded_subtitle_payload"
          "$RUNNER_TEMP/test_video_embedded_subtitle_payload"

          xcrun swiftc -parse-as-library \
            Models/Subtitle.swift \
            Features/Video/Subtitles/VideoSubtitleEdgeStyle.swift \
            Features/Video/Subtitles/EmbeddedSubtitlePayloadParser.swift \
            Features/Video/Subtitles/SubtitleParser.swift \
            Features/Video/Subtitles/SubtitleCueStore.swift \
            Features/Video/Subtitles/SubtitleOverlayRowHeightMeasurer.swift \
            script/test_video_subtitles.swift \
            -o "$RUNNER_TEMP/test_video_subtitles"
          "$RUNNER_TEMP/test_video_subtitles"

          xcrun swiftc -parse-as-library \
            Models/Subtitle.swift \
            Features/Video/Playback/PlaybackEngine.swift \
            Features/Video/Remote/YouTubeURLParser.swift \
            Features/Video/Remote/RemoteVideoSource.swift \
            Features/Video/VideoPlaybackHistoryStore.swift \
            script/test_video_playback_history.swift \
            -o "$RUNNER_TEMP/test_video_playback_history"
          "$RUNNER_TEMP/test_video_playback_history"

          xcrun swiftc -parse-as-library \
            Models/Subtitle.swift \
            Features/Video/Remote/RemoteVideoSource.swift \
            Features/Video/Remote/RemoteVideoResolver.swift \
            Features/Video/Remote/YouTubeURLParser.swift \
            Features/Video/Remote/YouTubeMediaModels.swift \
            Features/Video/Remote/YouTubeStreamSelector.swift \
            Features/Video/Remote/YouTubeKitRemoteVideoResolver.swift \
            script/test_video_youtube_remote_resolver.swift \
            -o "$RUNNER_TEMP/test_video_youtube_remote_resolver"
          "$RUNNER_TEMP/test_video_youtube_remote_resolver"

          swift script/test_video_anime_mining_contract.swift
          xcrun swiftc -parse-as-library \
            Models/Anki.swift \
            Core/AnkiMediaProcessor.swift \
            Features/Video/VideoMiningMediaStore.swift \
            script/test_video_screenshot_compression.swift \
            -o "$RUNNER_TEMP/test_video_screenshot_compression"
          "$RUNNER_TEMP/test_video_screenshot_compression"

          swift script/test_video_anime_mining_contract.swift
          xcrun swiftc -parse-as-library \
            Models/Anki.swift \
            Core/AnkiMediaProcessor.swift \
            Features/Video/VideoMiningMediaStore.swift \
            script/test_video_screenshot_compression.swift \
            -o "$RUNNER_TEMP/test_video_screenshot_compression"
          "$RUNNER_TEMP/test_video_screenshot_compression"

          xcrun swiftc -parse-as-library \
            Models/Subtitle.swift \
            Features/Video/Playback/PlaybackEngine.swift \
            Features/Video/Remote/YouTubeURLParser.swift \
            Features/Video/Remote/RemoteVideoSource.swift \
            Features/Video/Remote/RemoteVideoResolver.swift \
            Features/Video/VideoMediaTypes.swift \
            Features/Video/VideoPlaybackHistoryStore.swift \
            Features/Video/VideoLibraryStore.swift \
            Features/Video/VideoLibraryViewModel.swift \
            script/test_video_library_view_model.swift \
            -o "$RUNNER_TEMP/test_video_library_view_model"
          "$RUNNER_TEMP/test_video_library_view_model"

          xcrun swiftc -parse-as-library \
            Models/Subtitle.swift \
            Features/Video/Subtitles/SubtitleCueStore.swift \
            Features/Video/Playback/PlaybackEngine.swift \
            Features/Video/Remote/YouTubeURLParser.swift \
            Features/Video/Remote/RemoteVideoSource.swift \
            Features/Video/Remote/RemoteVideoResolver.swift \
            Features/Video/Remote/RemotePlaybackSession.swift \
            Features/Video/VideoPlaylist.swift \
            Features/Video/VideoInspectorState.swift \
            Features/Video/VideoPlaybackHistoryStore.swift \
            Features/Video/VideoPlayerViewModel.swift \
            script/test_video_playback_model.swift \
            -o "$RUNNER_TEMP/test_video_playback_model"
          "$RUNNER_TEMP/test_video_playback_model"

          xcrun swiftc -parse-as-library \
            Models/Subtitle.swift \
            Features/Video/Playback/PlaybackEngine.swift \
            Features/Video/Remote/YouTubeURLParser.swift \
            Features/Video/Remote/RemoteVideoSource.swift \
            Features/Video/VideoWindowCoordinator.swift \
            script/test_video_window_open_request.swift \
            -o "$RUNNER_TEMP/test_video_window_open_request"
          "$RUNNER_TEMP/test_video_window_open_request"

          xcrun swiftc -parse-as-library \
            Models/Subtitle.swift \
            Features/Video/Playback/PlaybackEngine.swift \
            Features/Video/Remote/YouTubeURLParser.swift \
            Features/Video/Remote/RemoteVideoSource.swift \
            Features/Video/VideoMediaTypes.swift \
            Features/Video/VideoWindowCoordinator.swift \
            script/test_video_window_coordinator.swift \
            -o "$RUNNER_TEMP/test_video_window_coordinator"
          "$RUNNER_TEMP/test_video_window_coordinator"

  build-mac:
    name: Build DMG
    needs: release-validation
    runs-on: macos-26
    env:
      HOSHI_RELEASE_SIGNING_IDENTITY: ${{ secrets.HOSHI_RELEASE_SIGNING_IDENTITY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.version) || github.ref }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          prerelease="false"
          if [[ "$version" == *-* || "$version" =~ [Bb][Ee][Tt][Aa] ]]; then
            prerelease="true"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Building Niratan Mac $version"

      - name: Import release signing certificate
        shell: bash
        env:
          HOSHI_RELEASE_CERTIFICATE_P12_BASE64: ${{ secrets.HOSHI_RELEASE_CERTIFICATE_P12_BASE64 }}
          HOSHI_RELEASE_CERTIFICATE_PASSWORD: ${{ secrets.HOSHI_RELEASE_CERTIFICATE_PASSWORD }}
          HOSHI_RELEASE_KEYCHAIN_PASSWORD: ${{ secrets.HOSHI_RELEASE_KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "${HOSHI_RELEASE_CERTIFICATE_P12_BASE64:-}" ]]; then
            if [[ -n "${HOSHI_RELEASE_SIGNING_IDENTITY:-}" ]]; then
              echo "HOSHI_RELEASE_SIGNING_IDENTITY is set, but HOSHI_RELEASE_CERTIFICATE_P12_BASE64 is missing." >&2
              exit 1
            fi
            echo "No release signing certificate secret configured; package_mac.sh will use ad-hoc signing."
            exit 0
          fi
          if [[ -z "${HOSHI_RELEASE_CERTIFICATE_PASSWORD:-}" ]]; then
            echo "HOSHI_RELEASE_CERTIFICATE_PASSWORD is required when importing a release signing certificate." >&2
            exit 1
          fi
          if [[ -z "${HOSHI_RELEASE_SIGNING_IDENTITY:-}" ]]; then
            echo "HOSHI_RELEASE_SIGNING_IDENTITY is required when importing a release signing certificate." >&2
            exit 1
          fi

          keychain_password="${HOSHI_RELEASE_KEYCHAIN_PASSWORD:-$(uuidgen)}"
          keychain_path="$RUNNER_TEMP/niratan-release-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/niratan-release-signing.p12"

          printf '%s' "$HOSHI_RELEASE_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$HOSHI_RELEASE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

      - name: Build DMG
        shell: bash
        run: script/package_mac.sh "${{ steps.version.outputs.version }}"

      - name: Verify animated AVIF runtime
        shell: bash
        run: script/test_animated_avif_exporter.sh

      - name: Collect artifact
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          artifact="Niratan-Mac-$version"
          mkdir -p "$RUNNER_TEMP/release-artifact"
          cp "release/$artifact.dmg" "$RUNNER_TEMP/release-artifact/"
          cp "release/$artifact.sha256" "$RUNNER_TEMP/release-artifact/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: niratan-mac
          path: ${{ runner.temp }}/release-artifact/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-mac
    runs-on: ubuntu-latest
    env:
      HOSHI_RELEASE_SIGNING_IDENTITY: ${{ secrets.HOSHI_RELEASE_SIGNING_IDENTITY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.version) || github.ref }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          prerelease="false"
          if [[ "$version" == *-* || "$version" =~ [Bb][Ee][Tt][Aa] ]]; then
            prerelease="true"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Publishing Niratan Mac $version"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Resolve artifacts
        id: artifacts
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          dmg="release/Niratan-Mac-$version.dmg"
          checksum="release/Niratan-Mac-$version.sha256"
          sha256="$(awk '{print $1}' "$checksum")"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Create release notes
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          sha256="${{ steps.artifacts.outputs.sha256 }}"
          tag="v$version"
          if [[ -n "${HOSHI_RELEASE_SIGNING_IDENTITY:-}" ]]; then
            signing_note="This release is signed with the configured macOS release certificate but is not notarized."
          else
            signing_note="This release is an ad-hoc signed native macOS build without a Developer ID signature or notarization."
          fi
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          tag_notes="$(git for-each-ref "refs/tags/$tag" --format='%(contents)' | sed '1{/^Niratan Mac /d;}')"
          cat > "release/release-notes-$version.md" <<EOF
          ## Niratan Mac $version

          ${tag_notes:-This Mac-focused release includes the latest fixes from the tagged source.}

          ### Install
          $signing_note

          Download \`Niratan-Mac-$version.dmg\`, then drag \`Niratan.app\` to Applications. If macOS blocks it, open the app from Finder with right click > Open.

          ### Checksum
          \`Niratan-Mac-$version.dmg\`

          SHA256: \`$sha256\`

          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="v$version"
          prerelease="${{ steps.version.outputs.prerelease }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" \
              "${{ steps.artifacts.outputs.dmg }}" \
              "${{ steps.artifacts.outputs.checksum }}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Niratan Mac $version" \
              --notes-file "release/release-notes-$version.md" \
              --prerelease="$prerelease"
          else
            gh release create "$tag" \
              "${{ steps.artifacts.outputs.dmg }}" \
              "${{ steps.artifacts.outputs.checksum }}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Niratan Mac $version" \
              --notes-file "release/release-notes-$version.md" \
              --prerelease="$prerelease" \
              --verify-tag
          fi
