name: Release Mac

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.6.0 or 0.6.0-beta"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-validation:
    name: Validate release source
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.version) || github.ref }}

      - name: Verify release contracts
        shell: bash
        run: |
          bash script/verify_native_release_contract.sh
          bash script/verify_full_build_contract.sh
          bash script/test_cleanup_build_artifacts.sh

      - name: Verify AidokuRuntime package
        shell: bash
        run: |
          export CLANG_MODULE_CACHE_PATH="$RUNNER_TEMP/hoshi-clang-module-cache"
          export SWIFT_MODULECACHE_PATH="$RUNNER_TEMP/hoshi-swift-module-cache"
          swift test --package-path Libraries/AidokuRuntime

      - name: Run regression tests
        shell: bash
        run: |
          # Every script/test_* check; each test declares its source dependencies.
          # Tests needing an Xcode build or bootstrapped video libraries report SKIP.
          bash script/run_tests.sh

  build-mac:
    name: Build DMG
    needs: release-validation
    runs-on: macos-26
    env:
      HOSHI_RELEASE_SIGNING_IDENTITY: ${{ secrets.HOSHI_RELEASE_SIGNING_IDENTITY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.version) || github.ref }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          prerelease="false"
          if [[ "$version" == *-* || "$version" =~ [Bb][Ee][Tt][Aa] ]]; then
            prerelease="true"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Building Niratan Mac $version"

      - name: Import release signing certificate
        shell: bash
        env:
          HOSHI_RELEASE_CERTIFICATE_P12_BASE64: ${{ secrets.HOSHI_RELEASE_CERTIFICATE_P12_BASE64 }}
          HOSHI_RELEASE_CERTIFICATE_PASSWORD: ${{ secrets.HOSHI_RELEASE_CERTIFICATE_PASSWORD }}
          HOSHI_RELEASE_KEYCHAIN_PASSWORD: ${{ secrets.HOSHI_RELEASE_KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "${HOSHI_RELEASE_CERTIFICATE_P12_BASE64:-}" ]]; then
            if [[ -n "${HOSHI_RELEASE_SIGNING_IDENTITY:-}" ]]; then
              echo "HOSHI_RELEASE_SIGNING_IDENTITY is set, but HOSHI_RELEASE_CERTIFICATE_P12_BASE64 is missing." >&2
              exit 1
            fi
            echo "No release signing certificate secret configured; package_mac.sh will use ad-hoc signing."
            exit 0
          fi
          if [[ -z "${HOSHI_RELEASE_CERTIFICATE_PASSWORD:-}" ]]; then
            echo "HOSHI_RELEASE_CERTIFICATE_PASSWORD is required when importing a release signing certificate." >&2
            exit 1
          fi
          if [[ -z "${HOSHI_RELEASE_SIGNING_IDENTITY:-}" ]]; then
            echo "HOSHI_RELEASE_SIGNING_IDENTITY is required when importing a release signing certificate." >&2
            exit 1
          fi

          keychain_password="${HOSHI_RELEASE_KEYCHAIN_PASSWORD:-$(uuidgen)}"
          keychain_path="$RUNNER_TEMP/niratan-release-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/niratan-release-signing.p12"

          printf '%s' "$HOSHI_RELEASE_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$HOSHI_RELEASE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

      - name: Build DMG
        shell: bash
        run: script/package_mac.sh "${{ steps.version.outputs.version }}"

      - name: Verify animated AVIF runtime
        shell: bash
        run: script/test_animated_avif_exporter.sh

      - name: Collect artifact
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          artifact="Niratan-Mac-$version"
          mkdir -p "$RUNNER_TEMP/release-artifact"
          cp "release/$artifact.dmg" "$RUNNER_TEMP/release-artifact/"
          cp "release/$artifact.sha256" "$RUNNER_TEMP/release-artifact/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: niratan-mac
          path: ${{ runner.temp }}/release-artifact/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-mac
    runs-on: ubuntu-latest
    env:
      HOSHI_RELEASE_SIGNING_IDENTITY: ${{ secrets.HOSHI_RELEASE_SIGNING_IDENTITY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.version) || github.ref }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          prerelease="false"
          if [[ "$version" == *-* || "$version" =~ [Bb][Ee][Tt][Aa] ]]; then
            prerelease="true"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Publishing Niratan Mac $version"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Resolve artifacts
        id: artifacts
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          dmg="release/Niratan-Mac-$version.dmg"
          checksum="release/Niratan-Mac-$version.sha256"
          sha256="$(awk '{print $1}' "$checksum")"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Create release notes
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          sha256="${{ steps.artifacts.outputs.sha256 }}"
          tag="v$version"
          if [[ -n "${HOSHI_RELEASE_SIGNING_IDENTITY:-}" ]]; then
            signing_note="This release is signed with the configured macOS release certificate but is not notarized."
          else
            signing_note="This release is an ad-hoc signed native macOS build without a Developer ID signature or notarization."
          fi
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          tag_notes="$(git for-each-ref "refs/tags/$tag" --format='%(contents)' | sed '1{/^Niratan Mac /d;}')"
          cat > "release/release-notes-$version.md" <<EOF
          ## Niratan Mac $version

          ${tag_notes:-This Mac-focused release includes the latest fixes from the tagged source.}

          ### Install
          $signing_note

          Download \`Niratan-Mac-$version.dmg\`, then drag \`Niratan.app\` to Applications. If macOS blocks it, open the app from Finder with right click > Open.

          ### Checksum
          \`Niratan-Mac-$version.dmg\`

          SHA256: \`$sha256\`

          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="v$version"
          prerelease="${{ steps.version.outputs.prerelease }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" \
              "${{ steps.artifacts.outputs.dmg }}" \
              "${{ steps.artifacts.outputs.checksum }}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Niratan Mac $version" \
              --notes-file "release/release-notes-$version.md" \
              --prerelease="$prerelease"
          else
            gh release create "$tag" \
              "${{ steps.artifacts.outputs.dmg }}" \
              "${{ steps.artifacts.outputs.checksum }}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Niratan Mac $version" \
              --notes-file "release/release-notes-$version.md" \
              --prerelease="$prerelease" \
              --verify-tag
          fi
